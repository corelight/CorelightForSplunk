[Detections_151]
action.logevent.param.event = Corelight Detection  - $result.did$
action.logevent.param.index = corelight
action.logevent.param.source = Corelight: $name$
action.logevent.param.sourcetype = corelight_alerts
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Corelight Detections \
Initial alert from conn containing one or more suri_ids{} values on any conn log event \
Correlated with conn, dns, ssl, http, files log types matching by uids\
Enriched by corelight_detection_enrichment.csv \
filtered by impact_score (from CSV) greater than 3\
Creates a hash and validate if the hash exists on the corelight_detections sourcetype and only collects what does not match (new detections)
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.events.fields = ["host","source","sourcetype","is_dest_internal_ip","is_src_internal_ip"]
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = dev_corelight_app
request.ui_dispatch_view = search
search = index="corelight" sourcetype="corelight_conn"  suri_ids{}=*\
| fields uid, ts, id.orig_h, id.resp_h, suri_ids{}, sourcetype\
| mvexpand suri_ids{}\
| eval suri_id='suri_ids{}'\
| join type=outer suri_id uid\
    [ search index="corelight" sourcetype="corelight_suricata_corelight"\
      | fields suri_id, alert.signature_id, alert.signature, uid\
      | rename alert.signature_id as sid, alert.signature as signature]\
\
| eval signatures=mvappend(null,signature)\
| lookup corelight_alert_aggregations sid OUTPUT impact_score\
| where impact_score > 3\
\
|eval new_path=sourcetype\
| join type=left uid\
    [ search index="corelight"  sourcetype="corelight_files"\
    | fields sourcetype, uid \
    | rename sourcetype as files_path\
    ]\
    \
|eval new_path=mvappend(new_path,files_path)\
| join type=left uid\
    [ search index="corelight"  sourcetype="corelight_http" \
    | fields sourcetype, uid \
    | rename sourcetype as http_path\
    ]\
|eval new_path=mvappend(new_path, http_path)\
| join type=left uid\
    [ search index="corelight"  sourcetype="corelight_smb*"\
    | fields sourcetype, uid \
    | rename sourcetype as smb_path\
    ]\
|eval new_path=mvappend(new_path, smb_path)\
\
| join type=left uid\
    [ search index="corelight" sourcetype="corelight_ssl"\
    | fields sourcetype, uid \
    | rename sourcetype as ssl_path\
    ]\
|eval new_path=mvappend(new_path, ssl_path)\
\
| join type=left uid\
    [ search index="corelight" sourcetype="corelight_dns"\
    | fields sourcetype, uid \
    | rename sourcetype as dns_path\
    ]\
|eval new_path=mvappend(new_path, dns_path)\
\
\
| stats values(new_path) as paths, list(sid) as sids, list(signatures) as signatures, values(id.orig_h) as orig_h, values(id.resp_h) as resp_h, values(ts) as ts by uid\
\
| eval sids = mvappend(sids, 'sids{}')\
| fields - 'sids{}'\
\
| eval sids_sorted = mvjoin(mvsort(sids), ",")\
| eval did = substr(sha1(sids_sorted), 2, 8)\
| eval dethash = sha1(sids_sorted + "," + uid + "," + tostring(ts) + ",")\
\
| search NOT [\
    search index="corelight" sourcetype="corelight_detections5"\
    | fields dethash\
    | dedup dethash\
    | format ]\
\
| eval _raw = json_object(\
    "sid", sids,\
    "signatures", signatures,\
    "uid", uid,\
    "id.orig_h", orig_h,\
    "id.resp_h", resp_h,\
    "did", did,\
    "ts", ts,\
    "dethash", dethash,\
    "paths", paths\
)\
|  fields _raw\
|  collect index=corelight sourcetype=corelight_detections5

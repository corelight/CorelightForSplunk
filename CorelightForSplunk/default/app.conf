[launcher]
version = 2.6.0
author = Corelight, Inc.
description = The Corelight App for Splunk enables incident responders and threat hunters who use Splunk® and Splunk Enterprise Security to work faster and more effectively.

[id]
version = 2.6.0
name = CorelightForSplunk

[install]
is_configured = false
state = enabled

[package]
id = CorelightForSplunk
check_for_updates = true

[ui]
label = Corelight App For Splunk
is_visible = true

[triggers]
reload.corelightforsplunk_settings = simple
reload.apl_logging = simple

[diag]
extension_script = Diag.py
